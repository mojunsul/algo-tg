name: Update study

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:
    inputs:
      skip:
        description: "출제자 순서를 건너뛸 인원 수"
        default: "0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update week and publisher
        run: python scripts/bump_week.py --base "${{ github.event.before }}" --skip "${{ inputs.skip || 0 }}"

      - name: Generate problem folders
        run: python scripts/generate_problems.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md problem_solve .github/study_state.json
          git diff --cached --quiet || (git commit -m "chore: update week and problem folders" && git push)
